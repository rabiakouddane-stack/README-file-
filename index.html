<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bonjour</title>
  <style>
    :root { --bg: #fdf8f3; --fg: #2b2a28; --accent: #c2410c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1b1a; --fg: #f3efe9; --accent: #fb923c; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    h1 {
      font-size: clamp(3rem, 12vw, 7rem);
      margin: 0;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent); }
    p { font-size: 1.25rem; opacity: 0.75; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <main>
    <h1>Bonjour<span>&nbsp;!</span></h1>
    <p>Bienvenue sur cette page.</p>
  </main>
</body>
</html>
